[package]
name = "tigo_soc_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "macros"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
axum = { version = "0.7", features = ["ws"] }
dotenvy = "0.15"
pcap = "2.5.0"
etherparse = "0.21.0"

# Feature Engineering columnar estructurado de alto rendimiento
polars = { version = "0.41", features = ["lazy", "csv", "parquet", "dtype-categorical"] }
# Motor LightGBM moderno para inferencia y entrenamiento
lightgbm3 = "1.0.8"
# Fix de compatibilidad de hashbrown para Polars
hashbrown = { version = "0.14", features = ["raw"] }
# Utilidades CLI, matemáticas y archivos
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
glob = "0.3"
anyhow = "1.0"
# Cliente HTTP para webhooks y notificaciones Push (FCM)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Servidor de archivos estáticos y CORS para PWA
tower-http = { version = "0.5", features = ["fs", "cors"] }
