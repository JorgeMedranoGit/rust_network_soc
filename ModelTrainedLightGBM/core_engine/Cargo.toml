[package]
name = "core_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Procesamiento de datos de alto rendimiento
polars = { version = "0.41", features = ["lazy", "csv", "parquet", "dtype-categorical"] }
# Motor LightGBM moderno
lightgbm3 = "1.0.8" 
# Fix para compatibilidad interna de Polars
hashbrown = { version = "0.14", features = ["raw"] }
# Utilidades
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Runtime asíncrono para el sistema web
tokio = { version = "1.14", features = ["full"] }
# Interfaz de línea de comandos para tu defensa
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
glob = "0.3"
rand = "0.8"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures-util = "0.3"