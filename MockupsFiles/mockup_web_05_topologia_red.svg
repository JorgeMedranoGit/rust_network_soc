<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#080C14"/>

  <!-- Barra Superior -->
  <rect width="1440" height="52" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="24" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800">TIGO SOC</text>
  <text x="120" y="32" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">|</text>
  <text x="136" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">MAPA DE TOPOLOGÍA DE RED GNS3 &amp; INVENTARIO ISP BOLIVIA</text>

  <!-- Filtros Superiores de Segmento -->
  <g transform="translate(24, 72)">
    <rect x="0" y="0" width="100" height="32" rx="4" fill="#0284C7"/>
    <text x="50" y="21" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TODOS (12)</text>

    <rect x="110" y="0" width="150" height="32" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="185" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle">DMZ ATACANTE (1)</text>

    <rect x="270" y="0" width="180" height="32" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="360" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle">VLAN 10 CLIENTES (9)</text>

    <rect x="460" y="0" width="150" height="32" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="535" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="middle">GATEWAYS CORE (2)</text>
  </g>

  <!-- Lienzo Central de Topología Esquemática Profesional (Sin 3D borroso ni efectos WebGL inestables) -->
  <g transform="translate(24, 120)">
    <rect width="1020" height="746" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    
    <!-- Cuadrícula de Red Sutil -->
    <defs>
      <pattern id="netgrid" width="30" height="30" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#1C273B"/>
      </pattern>
    </defs>
    <rect width="1020" height="746" fill="url(#netgrid)"/>

    <!-- ENLACES DE RED (Líneas Ortogonales Limpias) -->
    <!-- Enlace WAN -> Gateway pfSense -->
    <line x1="510" y1="40" x2="510" y2="120" stroke="#334155" stroke-width="2"/>
    <!-- pfSense -> Router Core L3 -->
    <line x1="510" y1="180" x2="510" y2="260" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Router Core -> DMZ Atacante (Línea Roja de Alerta) -->
    <line x1="450" y1="290" x2="180" y2="290" stroke="#DC2626" stroke-width="2" stroke-dasharray="4"/>
    <line x1="180" y1="290" x2="180" y2="380" stroke="#DC2626" stroke-width="2"/>

    <!-- Router Core -> Switch L2 Clientes -->
    <line x1="570" y1="290" x2="720" y2="290" stroke="#334155" stroke-width="2"/>
    <line x1="720" y1="290" x2="720" y2="380" stroke="#334155" stroke-width="2"/>

    <!-- Switch L2 Clientes -> Víctimas Alpine 1 a 9 -->
    <path d="M 520 440 L 920 440" stroke="#334155" stroke-width="2"/>
    <line x1="540" y1="440" x2="540" y2="520" stroke="#334155" stroke-width="1"/>
    <line x1="635" y1="440" x2="635" y2="520" stroke="#334155" stroke-width="1"/>
    <line x1="730" y1="440" x2="730" y2="520" stroke="#DC2626" stroke-width="2"/> <!-- Víctima 5 Bajo Ataque -->
    <line x1="825" y1="440" x2="825" y2="520" stroke="#334155" stroke-width="1"/>
    <line x1="920" y1="440" x2="920" y2="520" stroke="#334155" stroke-width="1"/>

    <!-- NODO WAN / INTERNET -->
    <g transform="translate(450, 20)">
      <rect width="120" height="36" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="60" y="23" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">WAN / INTERNET</text>
    </g>

    <!-- NODO 1: pfSense_Gateway (Firewall Perimetral) -->
    <g transform="translate(430, 120)">
      <rect width="160" height="60" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="80" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">pfSense_Gateway</text>
      <text x="80" y="42" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11" text-anchor="middle">192.168.1.1 (SSH/Sniffer)</text>
      <circle cx="16" cy="18" r="4" fill="#16A34A"/>
    </g>

    <!-- NODO 2: Router_Core_L3 (MikroTik RouterOS) -->
    <g transform="translate(430, 260)">
      <rect width="160" height="60" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
      <text x="80" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Router_Core_L3</text>
      <text x="80" y="42" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11" text-anchor="middle">192.168.1.254 (MikroTik)</text>
      <circle cx="16" cy="18" r="4" fill="#16A34A"/>
    </g>

    <!-- NODO 3: ATACANTE (AttackerKali) en DMZ -->
    <g transform="translate(100, 380)">
      <rect width="160" height="74" rx="6" fill="#450A0A" stroke="#DC2626" stroke-width="2"/>
      <text x="80" y="24" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AttackerKali</text>
      <text x="80" y="42" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11" text-anchor="middle">192.168.100.50</text>
      <text x="80" y="58" fill="#DC2626" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">[ATACANTE DETECTADO]</text>
      <circle cx="16" cy="18" r="4" fill="#DC2626"/>
    </g>

    <!-- NODO 4: SWITCH L2 CORPORATIVO -->
    <g transform="translate(640, 380)">
      <rect width="160" height="50" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="80" y="22" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Switch_L2_Cisco</text>
      <text x="80" y="38" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" text-anchor="middle">VLAN 10 Clientes (1-9)</text>
      <circle cx="16" cy="18" r="4" fill="#16A34A"/>
    </g>

    <!-- NODOS VÍCTIMAS ALPINE (Filas ordenadas) -->
    <!-- VictimeAlpine1 -->
    <g transform="translate(490, 520)">
      <rect width="100" height="50" rx="4" fill="#080C14" stroke="#334155" stroke-width="1"/>
      <text x="50" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Alpine1</text>
      <text x="50" y="36" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" text-anchor="middle">.1.11</text>
    </g>

    <!-- VictimeAlpine3 -->
    <g transform="translate(595, 520)">
      <rect width="100" height="50" rx="4" fill="#080C14" stroke="#334155" stroke-width="1"/>
      <text x="50" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Alpine3</text>
      <text x="50" y="36" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" text-anchor="middle">.1.13</text>
    </g>

    <!-- VictimeAlpine5 (OBJETIVO BAJO ATAQUE RESALTADO) -->
    <g transform="translate(700, 520)">
      <rect width="100" height="54" rx="4" fill="#450A0A" stroke="#DC2626" stroke-width="2"/>
      <text x="50" y="20" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Alpine5</text>
      <text x="50" y="36" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">.1.15 : 80</text>
      <text x="50" y="48" fill="#DC2626" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="9" text-anchor="middle">BAJO ATAQUE</text>
    </g>

    <!-- VictimeAlpine7 -->
    <g transform="translate(805, 520)">
      <rect width="100" height="50" rx="4" fill="#080C14" stroke="#334155" stroke-width="1"/>
      <text x="50" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Alpine7</text>
      <text x="50" y="36" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" text-anchor="middle">.1.17</text>
    </g>

    <!-- VictimeAlpine9 -->
    <g transform="translate(910, 520)">
      <rect width="100" height="50" rx="4" fill="#080C14" stroke="#334155" stroke-width="1"/>
      <text x="50" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Alpine9</text>
      <text x="50" y="36" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" text-anchor="middle">.1.19</text>
    </g>

    <!-- Leyenda Técnica de Topología -->
    <g transform="translate(30, 680)">
      <rect width="360" height="46" rx="4" fill="#1E293B" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#16A34A"/>
      <text x="32" y="27" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11">Operativo</text>

      <circle cx="120" cy="23" r="5" fill="#DC2626"/>
      <text x="132" y="27" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11">Bajo Ataque / Hostil</text>

      <circle cx="270" cy="23" r="5" fill="#64748B"/>
      <text x="282" y="27" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11">Aislado (CoA)</text>
    </g>
  </g>

  <!-- Panel Lateral Derecho: Telemetría del Nodo Seleccionado (370px) -->
  <g transform="translate(1060, 120)">
    <rect width="356" height="746" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <path d="M 0 6 Q 0 0 6 0 L 350 0 Q 356 0 356 6 L 356 48 L 0 48 Z" fill="#1E293B"/>
    <text x="20" y="30" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700">INSPECTOR DE NODO: VictimeAlpine5</text>

    <g transform="translate(20, 68)">
      <text x="0" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700">INFORMACIÓN DE CAPA DE ENLACE</text>
      <text x="0" y="24" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="13">IP: 192.168.1.15</text>
      <text x="0" y="44" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="12">MAC: 02:42:ac:11:00:0f</text>
      <text x="0" y="64" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="12">Vendor: GNS3 Alpine Workstation</text>
      <text x="0" y="84" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="12">Protocolo Mgmt: SSH (Port 22)</text>

      <line x1="0" y1="104" x2="316" y2="104" stroke="#1E293B" stroke-width="1"/>

      <text x="0" y="126" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700">ESTADO OPERACIONAL</text>
      <rect x="0" y="136" width="316" height="40" rx="4" fill="#450A0A" stroke="#DC2626" stroke-width="1"/>
      <text x="16" y="161" fill="#FCA5A5" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11" font-weight="700">ALERTADO: SYN Flood Saturando puerto 80</text>

      <line x1="0" y1="196" x2="316" y2="196" stroke="#1E293B" stroke-width="1"/>

      <text x="0" y="218" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700">ACCIONES INMEDIATAS DISPONIBLES</text>
      
      <!-- Botón 1: Aislar L2 -->
      <rect x="0" y="232" width="316" height="42" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="158" y="258" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Aislar Host vía RADIUS CoA</text>

      <!-- Botón 2: Bloquear Atacante L3 -->
      <rect x="0" y="284" width="316" height="42" rx="6" fill="#DC2626"/>
      <text x="158" y="310" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Descartar Tráfico Hostil (DROP 192.168.100.50)</text>

      <!-- Botón 3: Captura PCAP en Nodo -->
      <rect x="0" y="336" width="316" height="42" rx="6" fill="#080C14" stroke="#0284C7" stroke-width="1"/>
      <text x="158" y="362" fill="#0284C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Iniciar Captura PCAP en Interfaz</text>
    </g>
  </g>
</svg>