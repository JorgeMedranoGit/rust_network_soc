      <text x="36" y="62" fill="#D97706" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" font-weight="700">SATURACIÓN AL 94%</text>
      <rect x="264" y="22" width="74" height="30" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="301" y="41" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AISLAR CoA</text>
