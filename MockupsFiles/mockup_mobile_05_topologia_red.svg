  <!-- Barra de Navegación Inferior -->
  <g transform="translate(0, 756)">
    <rect width="390" height="60" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="54" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" text-anchor="middle">Mando</text>
    <text x="134" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" text-anchor="middle">Alertas</text>
    <text x="214" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" text-anchor="middle">Mitigar</text>
    <!-- Tab Activo: Red -->
