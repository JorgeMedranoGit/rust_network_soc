    <text x="45" y="20" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TODOS (12)</text>

    <rect x="98" y="0" width="116" height="32" rx="16" fill="#0F172A" stroke="#DC2626" stroke-width="1"/>
