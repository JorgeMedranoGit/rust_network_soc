  <g transform="translate(20, 52)">
    <text x="0" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800">Topología de Red</text>
    <text x="0" y="38" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11">GNS3 &amp; Docker / 12 Nodos</text>
  </g>

  <!-- Filtro Horizontal Deslizable con Píldoras Táctiles -->
  <g transform="translate(20, 104)">
