    <rect x="222" y="0" width="110" height="32" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="277" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" text-anchor="middle">NORMALES (10)</text>
