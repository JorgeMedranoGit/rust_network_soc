      <circle cx="20" cy="24" r="5" fill="#16A34A"/>
      <text x="36" y="28" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700">pfSense_Gateway</text>
      <text x="36" y="46" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11">IP: 192.168.1.1 (Perímetro / Sniffer)</text>
      <text x="290" y="40" fill="#16A34A" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10">ONLINE</text>
    </g>

    <!-- Nodo 4: Router Core MikroTik -->
    <g transform="translate(0, 244)">
      <rect width="350" height="66" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#16A34A"/>
      <text x="36" y="28" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700">Router_Core_L3</text>
      <text x="36" y="46" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11">IP: 192.168.1.254 (MikroTik L3)</text>
      <text x="290" y="40" fill="#16A34A" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10">ONLINE</text>
    </g>

    <!-- Nodo 5 al 12: Resumen Clientes Alpine -->
    <g transform="translate(0, 320)">
      <rect width="350" height="66" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#16A34A"/>
      <text x="36" y="28" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700">VictimeAlpine1..4, 6..9 (8 Hosts)</text>
      <text x="36" y="46" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11">VLAN 10 Clientes (192.168.1.11..19)</text>
      <text x="290" y="40" fill="#16A34A" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10">NORMAL</text>
