  <!-- Lista Jerárquica de Nodos Móviles -->
  <g transform="translate(20, 156)">
    
    <!-- Nodo 1: Atacante Kali -->
    <rect width="350" height="74" rx="6" fill="#450A0A" stroke="#DC2626" stroke-width="1"/>
    <circle cx="20" cy="24" r="5" fill="#DC2626"/>
    <text x="36" y="28" fill="#FCA5A5" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700">AttackerKali</text>
    <text x="36" y="46" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="11">IP: 192.168.100.50 (VLAN DMZ)</text>
    <text x="36" y="62" fill="#DC2626" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" font-weight="700">ORIGEN SYN FLOOD DETECTADO</text>
    <rect x="264" y="22" width="74" height="30" rx="4" fill="#DC2626"/>
    <text x="301" y="41" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">BLOQUEAR</text>

    <!-- Nodo 2: Víctima Alpine 5 (Bajo Ataque) -->
    <g transform="translate(0, 84)">
      <rect width="350" height="74" rx="6" fill="#450A0A" stroke="#D97706" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#D97706"/>
      <text x="36" y="28" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700">VictimeAlpine5</text>
