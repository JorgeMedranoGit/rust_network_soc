<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- Fondo y Chasis de Smartphone -->
  <rect width="390" height="844" rx="44" fill="#080C14" stroke="#2D3B54" stroke-width="4"/>
  
  <!-- Barra de Estado Móvil (16:54, 5G, Batería 94%) -->
  <g transform="translate(0, 0)">
    <!-- Notch / Dynamic Island -->
    <rect x="135" y="10" width="120" height="26" rx="13" fill="#03060B"/>
    <circle cx="230" cy="23" r="5" fill="#111B2C"/>
    
    <text x="36" y="28" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="13" font-weight="700">16:54</text>
    <text x="314" y="28" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="12">5G</text>
    <!-- Batería -->
    <rect x="338" y="18" width="22" height="12" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="340" y="20" width="15" height="8" rx="1" fill="#16A34A"/>
    <rect x="361" y="22" width="2" height="4" fill="#94A3B8"/>
  </g>

  <!-- CONTENIDO DE LA PANTALLA MÓVIL -->
  
  <!-- Encabezado de Marca Tigo SOC -->
  <g transform="translate(24, 70)">
    <text x="0" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800">TIGO SOC</text>
    <text x="0" y="44" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13">Operaciones Móviles de Ciberseguridad</text>
  </g>

  <!-- Formulario de Autenticación Optimizado para el Pulgar (WCAG Touch Targets &gt;= 48px) -->
  <g transform="translate(24, 150)">
    <rect width="342" height="580" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>

    <!-- Cabecera de Formulario -->
    <path d="M 0 8 Q 0 0 8 0 L 334 0 Q 342 0 342 8 L 342 56 L 0 56 Z" fill="#1E293B"/>
    <text x="20" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">Acceso Seguro RBAC</text>

    <g transform="translate(20, 80)">
      <!-- Input Usuario -->
      <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600">USUARIO</text>
      <rect x="0" y="10" width="302" height="48" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="40" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="14">admin_soc</text>

      <!-- Input Contraseña -->
      <text x="0" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600">CONTRASEÑA</text>
      <rect x="0" y="92" width="302" height="48" rx="6" fill="#080C14" stroke="#0284C7" stroke-width="2"/>
      <text x="16" y="122" fill="#F8FAFC" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="16" letter-spacing="3">••••••••••••</text>

      <!-- Selector de Rol -->
      <text x="0" y="164" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600">PERFIL RBAC</text>
      <rect x="0" y="174" width="302" height="48" rx="6" fill="#1E293B" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="204" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">SOC_ADMIN (Nivel 5)</text>

      <!-- Aviso Re-autenticación -->
      <rect x="0" y="240" width="302" height="64" rx="6" fill="#080C14" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="260" fill="#D97706" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" font-weight="700">POLÍTICA ZERO-TRUST MÓVIL</text>
      <text x="12" y="278" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11">Re-auth requerida cada 300s para mitigar.</text>
      <text x="12" y="292" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10">Expiración por inactividad: 15 min.</text>

      <!-- Botón Touch Primario (Altura 50px ergonomía Fitts) -->
      <rect x="0" y="326" width="302" height="50" rx="6" fill="#0284C7"/>
      <text x="151" y="357" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">INGRESAR A CONSOLA MÓVIL</text>

      <!-- Respaldo criptográfico -->
      <text x="151" y="420" fill="#64748B" font-family="'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" font-size="10" text-anchor="middle">TLS 1.3 | Axum Engine | PostgreSQL 15</text>
    </g>
  </g>


  <!-- Barra de Inicio Inferior (Home Indicator de iOS/Android) -->
  <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#64748B"/>
</svg>